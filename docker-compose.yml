# Frontend in Docker (localhost:3000) & Postgres DB (localhost:5432)
# Backend runs on host via systemd (localhost:8000).
# Nginx on host proxies: / -> frontend:3000, /auth, /upload, /ws, etc. -> backend:8000
services:
  db:
    image: postgres:15-alpine
    container_name: cad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cad_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-cad_material_tracker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cad_user -d cad_material_tracker"]
      interval: 3s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: absolute-builders-frontend
    container_name: absolute-builders-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - db

volumes:
  postgres_data:
